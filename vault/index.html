<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollin Free TV</title>
<meta name="description" content="Rollin Free TV: free designs, dropped on a rolling basis. Grab what you need and watch on YouTube.">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e8eaf0;
    --muted: #9aa3b2; --accent: #e5322d; --accent-text: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: .02em; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); text-decoration: none; font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn:hover { filter: brightness(1.08); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=search] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; color: var(--text); text-decoration: none; }
  .card:hover { border-color: var(--accent); }
  .thumb { aspect-ratio: 4 / 3; background: #0b0d11 repeating-conic-gradient(#14171d 0 25%, #0b0d11 0 50%) 0 0 / 24px 24px; display: flex; align-items: center; justify-content: center; }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .ext { font-size: 1.4rem; font-weight: 800; color: var(--muted); letter-spacing: .05em; }
  .meta { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .name { font-weight: 600; word-break: break-word; }
  .size { color: var(--muted); font-size: .85rem; }
  .meta .btn { margin-top: auto; text-align: center; }
  .folder { grid-column: 1 / -1; margin-top: 8px; color: var(--muted); font-size: .9rem; text-transform: uppercase; letter-spacing: .08em; }
  .status { color: var(--muted); padding: 24px 0; }
  .status a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Rollin Free TV</h1>
      <p class="sub">F.T.W. Free designs, dropped on a rolling basis. Click any card to download.</p>
    </div>
    <div class="actions">
      <a class="btn" id="zipLink" href="#" title="Zips the whole folder of designs">Download everything (.zip)</a>
      <a class="btn primary" id="uploadLink" href="#" target="_blank" rel="noopener">Upload designs</a>
    </div>
  </header>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search files..." aria-label="Search files">
  </div>

  <div id="status" class="status">Loading files...</div>
  <div id="grid" class="grid"></div>

  <footer>
    Files are stored in the <a id="repoLink" href="#" target="_blank" rel="noopener">GitHub repo</a>, so this page doubles as a backup.
  </footer>
</div>

<script>
  // ---- Config: change these if the repo or branch ever moves ----
  const OWNER = 'buyfabshit-lab';
  const REPO = 'testrepo';
  const BRANCH = 'claude/seedance-railway-deploy-lcldsa';
  const FOLDER = 'vault/files';
  // ---------------------------------------------------------------

  const IMAGE_EXT = new Set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif']);

  document.getElementById('repoLink').href = `https://github.com/${OWNER}/${REPO}/tree/${BRANCH}/${FOLDER}`;
  document.getElementById('uploadLink').href = `https://github.com/${OWNER}/${REPO}/upload/${BRANCH}/${FOLDER}`;
  document.getElementById('zipLink').href = `https://download-directory.github.io/?url=${encodeURIComponent(`https://github.com/${OWNER}/${REPO}/tree/${BRANCH}/${FOLDER}`)}`;

  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  let allFiles = [];

  function fmtSize(n) {
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KB`;
    return `${(n / 1024 / 1024).toFixed(1)} MB`;
  }

  function extOf(name) {
    const i = name.lastIndexOf('.');
    return i > -1 ? name.slice(i + 1).toLowerCase() : '';
  }

  function hrefFor(f) {
    // The files are deployed under /files/ on this site, so link to them directly.
    // Same-origin links let the download attribute force a save.
    const rel = f.path.slice(FOLDER.length + 1);
    return `/files/${rel.split('/').map(encodeURIComponent).join('/')}`;
  }

  async function listFolder(path) {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${encodeURIComponent(BRANCH)}`, {
      headers: { Accept: 'application/vnd.github+json' }
    });
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const items = await res.json();
    const out = [];
    for (const it of items) {
      if (it.type === 'dir') out.push(...await listFolder(it.path));
      else if (it.type === 'file' && !it.name.startsWith('.') && it.name.toLowerCase() !== 'readme.md') out.push(it);
    }
    return out;
  }

  function render(files) {
    grid.innerHTML = '';
    if (!files.length) {
      status.textContent = allFiles.length ? 'No files match that search.' : 'Nothing here yet. Hit "Upload designs" to add the first batch.';
      status.style.display = '';
      return;
    }
    status.style.display = 'none';

    let lastFolder = null;
    for (const f of files) {
      const rel = f.path.slice(FOLDER.length + 1);
      const folder = rel.includes('/') ? rel.slice(0, rel.lastIndexOf('/')) : '';
      if (folder !== lastFolder && folder) {
        const h = document.createElement('div');
        h.className = 'folder';
        h.textContent = folder;
        grid.appendChild(h);
      }
      lastFolder = folder;

      const ext = extOf(f.name);
      const href = hrefFor(f);
      const a = document.createElement('a');
      a.className = 'card';
      a.href = href;
      a.setAttribute('download', f.name);
      a.title = `Download ${f.name}`;

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      if (IMAGE_EXT.has(ext)) {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = f.name;
        img.src = href;
        thumb.appendChild(img);
      } else {
        const e = document.createElement('span');
        e.className = 'ext';
        e.textContent = ext ? `.${ext.toUpperCase()}` : 'FILE';
        thumb.appendChild(e);
      }

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `<div class="name"></div><div class="size">${fmtSize(f.size)}</div><span class="btn primary">Download</span>`;
      meta.querySelector('.name').textContent = f.name;

      a.append(thumb, meta);
      grid.appendChild(a);
    }
  }

  document.getElementById('q').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    render(q ? allFiles.filter(f => f.path.toLowerCase().includes(q)) : allFiles);
  });

  listFolder(FOLDER)
    .then(files => {
      allFiles = files.sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true }));
      render(allFiles);
    })
    .catch(err => {
      status.innerHTML = `Could not load the file list (${err.message}). You can still browse them directly in the <a href="https://github.com/${OWNER}/${REPO}/tree/${BRANCH}/${FOLDER}">repo folder</a>.`;
    });
</script>
</body>
</html>
